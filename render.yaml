# Render Blueprint for the FastAPI backend.
# In Render: New + > Blueprint, pick this repo. Then set the secret env vars
# (GROQ_API_KEY, DATABASE_URL, ALLOWED_ORIGINS) in the dashboard.
services:
  - type: web
    name: politicalpredictor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn predictor.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GROQ_API_KEY      # your Groq key (AI scorer + calibration)
        sync: false
      - key: DATABASE_URL      # Neon Postgres connection string
        sync: false
      - key: ALLOWED_ORIGINS   # your Vercel frontend URL, e.g. https://app.vercel.app
        sync: false
